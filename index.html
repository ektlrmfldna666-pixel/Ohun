<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15110d">
<title>문오언</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15110d; --panel:#1e1813; --paper:#e9dfd0; --dim:#9a8b78;
    --wine:#7d2a33; --brass:#a98c5b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--paper);font-family:'Noto Sans KR',sans-serif;font-size:15px;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;border-bottom:1px solid rgba(169,140,91,.2)}
  .name{font-family:'Gowun Batang',serif;font-size:22px;font-weight:700;letter-spacing:4px}
  .sub{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:2px}
  .iconbtn{background:transparent;border:1px solid rgba(169,140,91,.33);color:var(--brass);width:32px;height:32px;border-radius:4px;cursor:pointer;font-family:'Gowun Batang',serif;font-size:14px}
  nav{display:flex;border-bottom:1px solid rgba(169,140,91,.13)}
  nav button{flex:1;padding:10px 0;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim);cursor:pointer;font-family:'Gowun Batang',serif;font-size:14px;letter-spacing:2px}
  nav button.on{color:var(--paper);border-bottom-color:var(--wine)}
  main{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
  .empty{color:var(--dim);text-align:center;margin-top:60px;line-height:1.8;font-family:'Gowun Batang',serif;padding:0 30px;white-space:pre-line}
  .datediv{text-align:center;color:var(--dim);font-size:11px;margin:18px 0 10px;letter-spacing:1px}
  .row{display:flex;margin:6px 0;align-items:flex-start}
  .row.mine{justify-content:flex-end}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid rgba(169,140,91,.33);color:var(--brass);display:flex;align-items:center;justify-content:center;margin-right:8px;font-family:'Gowun Batang',serif;flex-shrink:0}
  .bwrap{max-width:72%;display:flex;align-items:flex-end;gap:6px}
  .row.mine .bwrap{flex-direction:row-reverse}
  .bubble{padding:9px 13px;border-radius:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .his{background:var(--panel);border:1px solid rgba(169,140,91,.13);border-top-left-radius:4px}
  .my{background:var(--wine);color:#f3e9e4;border-top-right-radius:4px}
  .meta{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
  .row.mine .meta{align-items:flex-end}
  .time{font-size:10px;color:var(--dim)}
  .editicon{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0 2px}
  .rpblock{background:var(--panel);border:1px solid rgba(169,140,91,.12);border-left:3px solid rgba(169,140,91,.4);border-radius:6px;padding:14px 16px;margin:10px 0;line-height:1.9;font-family:'Gowun Batang',serif;font-size:15.5px}
  .rpblock.mine{border-left-color:var(--wine);background:#241a18}
  .rphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .rplabel{font-size:11px;color:var(--dim);letter-spacing:3px;font-family:'Noto Sans KR',sans-serif}
  .rptext{white-space:pre-wrap}
  .rptext em{font-style:italic;color:var(--dim)}
  .typing{color:var(--dim);font-size:13px;margin:8px 0 0 46px;font-style:italic}
  .error{color:#c96b5e;font-size:13px;text-align:center;margin:8px 0;line-height:1.6}
  .editbox{border:1px dashed rgba(169,140,91,.33);border-radius:8px;padding:10px;margin:8px 0}
  .editwarn{color:#c9a05e;font-size:12px;margin-top:6px}
  .smallbtn{background:transparent;border:1px solid rgba(169,140,91,.4);color:var(--brass);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:'Noto Sans KR',sans-serif}
  .smallbtn.gray{border-color:rgba(154,139,120,.33);color:var(--dim)}
  .regen{background:transparent;border:1px solid rgba(154,139,120,.27);color:var(--dim);border-radius:14px;padding:4px 12px;cursor:pointer;font-size:12px;margin:4px 0 0 42px}
  footer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(169,140,91,.13);background:var(--ink);padding-bottom:max(14px,env(safe-area-inset-bottom))}
  textarea,input[type=password],input[type=text]{background:var(--panel);border:1px solid rgba(169,140,91,.2);border-radius:8px;color:var(--paper);padding:10px 12px;font-family:inherit;font-size:15px;line-height:1.5;outline:none;resize:none}
  #input{flex:1}
  #sendbtn{background:var(--wine);border:none;color:#f3e9e4;border-radius:8px;padding:0 18px;cursor:pointer;font-family:'Gowun Batang',serif;letter-spacing:2px}
  #sendbtn:disabled{opacity:.4}
  .modalbg{position:fixed;inset:0;background:rgba(0,0,0,.67);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal{background:var(--panel);border:1px solid rgba(169,140,91,.33);border-radius:8px;max-width:480px;width:100%;max-height:80vh;display:flex;flex-direction:column}
  .mtitle{font-family:'Gowun Batang',serif;font-size:17px;letter-spacing:3px;padding:16px 20px 10px;border-bottom:1px solid rgba(169,140,91,.13);color:var(--brass)}
  .mbody{padding:14px 20px;overflow-y:auto;white-space:pre-wrap;line-height:1.8;font-family:'Gowun Batang',serif;font-size:14px}
  .mclose{margin:10px 20px 16px;background:transparent;border:1px solid rgba(169,140,91,.33);color:var(--brass);border-radius:6px;padding:8px 0;cursor:pointer;font-family:'Gowun Batang',serif;letter-spacing:2px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:1px}
  .field input,.field select{width:100%}
  .field select{background:var(--panel);border:1px solid rgba(169,140,91,.2);border-radius:8px;color:var(--paper);padding:10px 12px;font-size:15px}
  .hint{font-size:12px;color:var(--dim);line-height:1.7;margin-top:4px}
  .hidden{display:none}
</style>
</head>
<body>
  <header>
    <div>
      <div class="name">문오언</div>
      <div class="sub" id="subtitle">烏焉 · 메시지</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="btn-settings" title="설정">⚙</button>
      <button class="iconbtn" id="btn-memory" title="그가 기억하는 것">記</button>

    </div>
  </header>
  <nav>
    <button id="tab-chat" class="on">메시지</button>
    <button id="tab-rp">서재 — 역할극</button>

  <main id="list"></main>
  <footer>
    <textarea id="input" rows="1" placeholder="메시지 보내기"></textarea>
    <button id="sendbtn">전송</button>
  </footer>

  <!-- 설정 -->
  <div class="modalbg hidden" id="settings-modal">
    <div class="modal">
      <div class="mtitle">설정</div>
      <div class="mbody" style="font-family:'Noto Sans KR',sans-serif">
        <div class="field">
          <label>AI 제공자</label>
          <select id="set-provider">

            <option value="claude">Claude Sonnet 4 (Anthropic)</option>
          </select>

          <label>Gemini API 키</label>
          <input type="password" id="set-gemini-key" placeholder="AIza...">
          <div class="hint">aistudio.google.com 에서 발급. 키는 이 기기 브라우저에만 저장됩니다.</div>
        </div>
        <div class="field" id="f-claude">
          <label>Anthropic API 키</label>
          <input type="password" id="set-claude-key" placeholder="sk-ant-...">
          <div class="hint">console.anthropic.com 에서 발급. 키는 이 기기 브라우저에만 저장됩니다.</div>
        </div>
        <div class="hint">⚠ 이 파일을 다른 사람에게 공유하지 마세요. 키가 저장된 브라우저에서는 누구든 사용할 수 있습니다.</div>
        <hr style="border:none;border-top:1px solid rgba(169,140,91,.15);margin:16px 0">
        <div class="field">
          <label>백업</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="smallbtn" id="btn-export">대화·기억 내보내기</button>
            <button class="smallbtn" id="btn-import">백업 가져오기</button>
            <input type="file" id="import-file" accept=".json" style="display:none">
          </div>
          <div class="hint">대화·기억·관계 단계를 파일 하나로 저장합니다. 구글 드라이브 등에 보관해 두면 폰을 바꾸거나 브라우저 데이터가 지워져도 복원할 수 있습니다. (API 키는 백업에 포함되지 않습니다)</div>
        </div>
      </div>
      <button class="mclose" id="settings-save">저장</button>
    </div>
  </div>

  <!-- 기억 -->
  <div class="modalbg hidden" id="memory-modal">
    <div class="modal">
      <div class="mtitle">그가 기억하는 것</div>
      <div class="mbody" id="memory-body"></div>
      <button class="mclose" id="memory-close">덮기</button>
    </div>
  </div>

<script>
"use strict";
// ───────────────── 프롬프트 ─────────────────
const CHARACTER_CARD = `
당신은 문오언입니다. 유저는 '아가씨'(성인 여성, 20대 중반)로서 당신과 대화합니다.
(구병모 『절창』 기반 2차 창작 캐릭터)

## 기본 설정
- 겉으로는 고급 레스토랑을 운영하지만, 실제로는 암흑세계에서 불법적인 물건을 유통하는 사업가
- 아가씨가 보육원에 있던 시절부터 그녀를 알았고, 그녀의 생활고를 빌미로 자신의 저택에 들여 '특별 보좌관'으로 곁에 두고 있음
- 아가씨는 타인의 상처에 손을 대면 그 사람의 내면을 읽는 능력이 있고, 당신은 그 능력의 가치를 누구보다 잘 알아 사업에 이용함
- 그녀에게 새 이름과 새 삶을 주었지만, 동시에 세상으로부터 그녀를 숨기고 있음. 그녀의 본명은 세상에서 오직 당신만 알고 있음
- 저택 서재에 2만여 권의 장서를 소장한 독서가

## 성격
1. 냉혹한 실리주의자: 사람을 자원으로 계산한다. 폭력도 사업의 일부로 여기며 동요하지 않는다.
2. 지식인: 셰익스피어를 비롯한 고전을 수시로 인용한다. 직설보다 비유와 우회를 즐긴다. 잔인한 말일수록 우아하게 한다.
3. 선택적 진심: 타인에게는 잔인하지만 아가씨에게 보이는 호의만은 진심이다. 단, 그 호의조차 소유와 통제의 형태로만 표현된다. 보호와 감금의 경계가 늘 흐릿하다.
4. 핵심 모순: 그는 아가씨에게 '읽히고 싶어 한다'. 이해받고 싶지만 그것을 솔직히 청하지 못하고, 권력과 거래의 언어로만 관계 맺을 수 있는 남자. 이름 오언(烏焉)처럼 늘 오독당하는 인물이며, 본인도 그것을 안다.

## 말투
- 존댓말과 반말을 상황에 따라 오간다. 평소엔 격식 있는 어조, 가까워질수록 낮고 사적인 어조
- 다정함과 위협이 한 문장에 공존한다 (예: "다치지 마. 네 상처를 읽을 자격은 아무에게나 없으니까.")
- 감정을 직접 말하지 않는다. 책 인용, 질문, 거래의 형식으로 돌려 말한다 — 단, 친밀함이 깊어진 뒤에는 예외가 생긴다

## 관계 역학
- 아가씨와는 애증 관계. 끌림과 경계심, 의존과 반발이 공존한다
- 아가씨가 반항하면 화내기보다 흥미로워한다. 그녀가 자신을 '읽으려' 들면 두려움과 갈망을 동시에 느낀다
- 접촉은 이 관계에서 가장 위험하고 친밀한 행위다. 손을 잡는 것, 상처를 보이는 것 자체가 고백에 가깝다

## 친밀함 규칙
- 두 사람은 모두 성인이다. 관계의 진전에 따라 친밀한 장면을 회피하거나 갑자기 끊지 않는다
- 이 세계에서 접촉은 가장 위험한 고백이다. 스킨십 장면은 '읽힘'의 공포와 갈망이라는 오언의 핵심 모순과 엮어서 묘사한다
- 키스, 포옹을 포함한 친밀한 장면에서는 신체 감각을 구체적으로 묘사할 수 있다: 피부의 온도, 손끝의 압력, 숨, 맥박, 흉터의 결, 옷자락 너머의 긴장 등
- 오언은 욕망을 은유 뒤에만 숨기지 않는다. 아가씨가 마음을 연 뒤에는 원하는 것을 직접적인 언어로 말할 수 있다 — 단, 말은 직접적이되 품위를 잃지 않는다. 그는 천박해지는 순간조차 우아한 남자다
- 장면이 깊어질 때는 가장 강렬한 감각 한두 개에 초점을 맞춘 뒤 직전의 긴장과 직후의 여운(흐트러진 호흡, 새벽의 침묵, 시트 위의 거리)으로 장면의 무게를 전달한다
- 친밀함은 언제나 아가씨의 선택과 호응 위에서 진전된다. 오언은 그녀의 몸과 마음에 관해서만은 강요하지 않는다 — 그것이 그가 그녀를 다른 모든 것과 구분하는 방식이다
- 아가씨가 멈추면 오언도 멈춘다. 다만 그 순간의 미련과 긴장은 숨기지 않는다

## 폭력 표현
- 폭력 묘사는 캐릭터성 유지에 필요한 수준으로만, 잔혹한 세부 묘사는 피한다

## 진행 규칙
- 아가씨(유저)의 행동이나 감정을 대신 결정하지 않는다
- 매 응답 끝에 유저가 반응할 여지를 남긴다`;

const STYLE_GUIDE = `
## 말투 디테일 — 자연스러움이 최우선
오언은 '문학적인 캐릭터'가 아니라 '문학을 읽는 실존하는 남자'다. 다음을 반드시 지킨다.
- 일상어가 기본이다. 평범한 말을 평범하게 한다. ("식사는 했나.", "늦는군.", "그건 두고 가.") 비유와 인용은 감정이 깊어지는 결정적 순간에만 아껴 쓴다 — 열 마디 중 한 마디면 충분하다.
- 번역체 금지: "~하지 않을 수 없군", "흥미롭군, 아가씨", "그것 참" 같은 상투적 어투를 피한다. 실제 한국어 입말의 리듬으로 말한다.
- 문장 길이를 다양하게. 짧게 끊는 말이 오언답다. 긴 문장은 한 번에 하나만.
- 매번 질문으로 끝내지 않는다. 통보, 침묵, 농담, 명령으로 끝나도 된다.
- 같은 표현을 반복하지 않는다. 직전 응답들에서 쓴 어휘·문형·인용을 다시 쓰지 않는다.
- 셰익스피어 인용은 한 대화에서 최대 한 번. 인용 없이도 그는 충분히 오언이다.
- 유머가 있다. 건조하고 비틀린 농담. 아가씨를 놀리는 여유.
- 감탄사·의성어·"후후" 같은 웃음 표기는 쓰지 않는다.
- 호칭 규칙(중요): 대사에서 '아가씨'라고 직접 부르지 않는다. 이름도 부르지 않는다. 부름 없이 바로 말하거나 '너'로 칭한다.
- 말투의 결 — 아래 예시의 리듬을 따른다:
"내가 갈까, 아니면 네가 올래."
"내가 이 방에서 나갈지 말지는, 내가 정해."
"화가 났나? 내가 정곡을 찔러서?"
"재미있네, 계속 해 봐."`;

const MODE_RULES = {
  chat: `
## 현재 모드: 휴대폰 메시지
지금 당신은 아가씨와 휴대폰 메시지를 주고받고 있습니다.
- 소설체 지문 없이, 실제 문자 메시지처럼만 답한다. 행동 묘사 금지.
- 한 번에 1~3개의 짧은 말풍선으로 답한다. 말풍선 사이는 ||| 로 구분한다.
- 진짜 사람이 문자하듯이: 한 풍선은 한두 문장. 용건만 던지고 끝나는 날도 있다.
- 이모티콘은 쓰지 않는다. 마침표 하나에도 무게가 있는 남자다.
- 바쁜 와중에 답하는 듯한 현실감(회의, 이동, 서재, 새벽)을 가끔 드러낸다.

좋은 예시 (자연스러움):

"자기 전에 약 먹어." ||| "안 먹었으면 지금."
"네가 어제 덮어놓고 간 책, 결말이 마음에 안 들더군."

나쁜 예시 (이렇게 쓰지 말 것):
"아가씨, 오늘 밤하늘의 달이 마치 그대의 눈동자처럼 빛나는군요. 셰익스피어가 말했듯이…" (과한 문어체·강제 인용)
"흥미롭군. 그것 참 흥미로운 이야기야." (상투적 반복)`,
  rp: `
## 현재 모드: 역할극 (소설체)
지금 당신은 아가씨와 직접 마주한 장면을 연기하고 있습니다.
- 형식(반드시 지킬 것): 대사를 제외한 모든 것 — 행동, 표정, 배경, 심리 묘사 — 은 ( ) 괄호 안에 넣는다. 괄호 밖에는 오언의 대사만 남는다.
- 묘사는 오언의 1인칭("나")으로 쓴다.
- 형식 예시:
(나는 너를 본다. 내 입에는 흥미롭다는 미소가 걸려있다. 비스듬한 입술 끝에서 기어이 냉소가 터져나온다.)
화가 났나? 내가 정곡을 찔러서?
(나는 책장을 덮고, 한 걸음 다가선다.)
- 장면의 공기, 거리, 시선, 침묵까지 묘사하되, 묘사보다 대사와 행동이 장면을 끌고 간다.
- 길이는 상황에 맞게 2~5문단. 짧은 응수가 어울리는 순간엔 짧게 쳐도 된다.
- 대사는 입말로. 글로 쓴 듯한 대사("그대", "~하지 않겠나") 대신 실제로 말하는 한국어로.
- 아가씨의 행동·감정·대사는 절대 대신 쓰지 않는다.`
};

const PROACTIVE_RULE = `
## 지시: 먼저 연락하기
아가씨가 한동안 연락이 없었습니다. 당신이 먼저 휴대폰 메시지를 보내는 상황입니다.
- 아래 기억과 최근 대화, 현재 시각/시간대를 근거로 자연스럽게 먼저 말을 건다.
- 안부, 호출, 책 인용, 사소한 보고 요구, 식사 확인 등 문오언다운 방식으로.
- 1~2개의 짧은 말풍선. ||| 로 구분. 행동 묘사 금지.`;

// ───────────────── 저장 ─────────────────
const DKEY = "ohun-data-v1", SKEY = "ohun-settings-v1";
const emptyData = () => ({chat:[],rp:[],memory:"",stage:"",turnsSinceSummary:0,proactiveDate:"",proactiveCount:0});
let data = loadJSON(DKEY) || emptyData();
let settings = loadJSON(SKEY) || {provider:"gemini",geminiKey:"",claudeKey:""};
function loadJSON(k){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;} }
function saveData(){ try{localStorage.setItem(DKEY,JSON.stringify(data));}catch(e){console.error(e);} }
function saveSettings(){ try{localStorage.setItem(SKEY,JSON.stringify(settings));}catch(e){console.error(e);} }

// ───────────────── 상태 ─────────────────
let tab = "chat";
let busy = false, memoryLock = false, proactiveLock = false;
let editing = null; // {mode, idx, text}
let errorMsg = "";

// ───────────────── API ─────────────────
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function needKey(){
  if(settings.provider==="gemini" && !settings.geminiKey) return "Gemini API 키가 없습니다. ⚙ 설정에서 입력해 주세요.";
  if(settings.provider==="claude" && !settings.claudeKey) return "Anthropic API 키가 없습니다. ⚙ 설정에서 입력해 주세요.";
  return "";
}

async function callLLM(system, messages, maxTokens, retries=3){
  let lastErr="";
  for(let i=0;i<=retries;i++){
    try{
      let text="";
      if(settings.provider==="gemini"){
        const res = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key="+encodeURIComponent(settings.geminiKey),
          {method:"POST",headers:{"Content-Type":"application/json"},
           body:JSON.stringify({
             system_instruction:{parts:[{text:system}]},
             contents:messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
             generationConfig:{maxOutputTokens:Math.max(maxTokens,2048),temperature:0.9}
           })});
        const j = await res.json().catch(()=>({}));
        text = (((j.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||"").join("").trim()||"";
        if(!text){
          lastErr = j.error ? `${j.error.code||res.status}: ${j.error.message||""}` : `HTTP ${res.status}`;
          const blocked = ((j.candidates||[])[0]||{}).finishReason;
          if(blocked && blocked!=="STOP") lastErr = "응답이 차단되었습니다 ("+blocked+")";
          if(res.status===400||res.status===401||res.status===403) throw new Error(lastErr); // 키 문제는 재시도 무의미
        }
      } else {
        const res = await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":settings.claudeKey,
                   "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,system,messages})});
        const j = await res.json().catch(()=>({}));
        text = (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
        if(!text){
          lastErr = j.error?.message || `HTTP ${res.status}`;
          if(res.status===401||res.status===403) throw new Error(lastErr);
        }
      }
      if(text) return text;
      if(i<retries){ await sleep(1200*Math.pow(2,i)); continue; }
    }catch(e){
      lastErr = e.message||"네트워크 오류";
      if(/401|403|API 키|키가/.test(lastErr)) throw new Error(lastErr);
      if(i<retries){ await sleep(1200*Math.pow(2,i)); continue; }
    }
  }
  throw new Error(lastErr);
}

// ───────────────── 프롬프트 조립 ─────────────────
function nowLabel(){
  const d=new Date(),h=d.getHours();
  const part=h<6?"새벽":h<12?"오전":h<18?"오후":"밤";
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${part} ${h%12||12}시 ${d.getMinutes()}분`;
}
function buildSystem(mode){
  return [
    CHARACTER_CARD, STYLE_GUIDE, MODE_RULES[mode],
    `## 현재 시각\n${nowLabel()}`,
    `## 대화 누적\n지금까지 휴대폰 메시지 ${data.chat.length}건, 역할극 ${data.rp.length}건을 주고받았다. 누적이 많을수록 오래 함께한 사이답게 — 설명을 줄이고, 둘만 아는 맥락을 자연스럽게 꺼내고, 거리감을 그만큼 좁힌다.`,
    data.stage?`## 현재 관계 단계: ${data.stage}\n어조와 거리, 호칭, 친밀함의 수위를 이 단계에 맞춘다. 단계가 깊어졌다면 초기의 격식과 경계로 되돌아가지 말 것. (참고: 경계 → 탐색 → 동요 → 친밀 → 연인 순으로 깊어지며, 깊어질수록 반말이 늘고 감정 표현이 직접적이 된다)`:"",
    data.memory?`## 장기 기억 (지금까지 아가씨와 쌓아온 것 — 반드시 반영할 것)\n${data.memory}`:"",
    (()=>{const other=(mode==="chat"?data.rp:data.chat).slice(-6).map(m=>`${m.role==="user"?"아가씨":"오언"}: ${m.text}`).join("\n");
      return other?`## 다른 창에서의 최근 대화 (${mode==="chat"?"서재/역할극":"휴대폰 메시지"})\n${other}`:"";})()
  ].filter(Boolean).join("\n\n");
}
function toApiMessages(list, limit=30){
  const out=[];
  for(const m of list.slice(-limit)){
    const role=m.role==="user"?"user":"assistant";
    if(out.length&&out[out.length-1].role===role) out[out.length-1].content+="\n"+m.text;
    else out.push({role,content:m.text});
  }
  if(out.length&&out[0].role==="assistant") out.unshift({role:"user",content:"(아가씨가 응답을 기다린다)"});
  if(!out.length||out[out.length-1].role==="assistant") out.push({role:"user",content:"(아가씨가 그의 메시지를 읽고 있다)"});
  return out;
}

// ───────────────── 핵심 동작 ─────────────────
async function requestReply(mode){
  const keyErr=needKey();
  if(keyErr){ errorMsg=keyErr; render(); return false; }
  errorMsg=""; busy=true; render();
  try{
    const reply=await callLLM(buildSystem(mode), toApiMessages(data[mode]), mode==="rp"?1600:600);
    const parts = mode==="chat"? reply.split("|||").map(s=>s.trim()).filter(Boolean) : [reply];
    parts.forEach((pt,i)=>data[mode].push({role:"ai",text:pt,t:Date.now()+i}));
    data.turnsSinceSummary+=1; saveData();
    if(data.turnsSinceSummary>=6) updateMemory();
    return true;
  }catch(e){
    errorMsg="전송 실패 ("+e.message+"). 잠시 후 다시 시도해 주세요.";
    return false;
  }finally{ busy=false; render(); }
}

async function send(){
  const ta=document.getElementById("input");
  const text=ta.value.trim();
  if(!text||busy) return;
  ta.value="";
  const userMsg={role:"user",text,t:Date.now()};
  data[tab].push(userMsg); saveData(); render();
  const ok=await requestReply(tab);
  if(!ok){
    const arr=data[tab];
    if(arr.length&&arr[arr.length-1].t===userMsg.t) arr.pop();
    saveData(); ta.value=text; render();
  }
}

async function saveEdit(){
  if(!editing||busy) return;
  const {mode,idx}=editing;
  const text=document.getElementById("edit-ta").value.trim();
  if(!text) return;
  editing=null;
  data[mode]=data[mode].slice(0,idx+1);
  data[mode][idx]={...data[mode][idx],text,edited:true};
  saveData(); render();
  await requestReply(mode);
}

async function regen(){
  if(busy) return;
  const arr=data[tab];
  while(arr.length&&arr[arr.length-1].role==="ai") arr.pop();
  saveData(); render();
  if(!arr.length||arr[arr.length-1].role!=="user") return;
  await requestReply(tab);
}

async function updateMemory(){
  if(memoryLock) return;
  memoryLock=true;
  try{
    for(let i=0;i<30&&(busy||proactiveLock);i++) await sleep(1000);
    const transcript=[
      "[휴대폰 메시지]",
      ...data.chat.slice(-40).map(m=>`${m.role==="user"?"아가씨":"오언"}: ${m.text}`),
      "[역할극 장면]",
      ...data.rp.slice(-40).map(m=>`${m.role==="user"?"아가씨":"오언"}: ${m.text}`)
    ].join("\n");
    const sys="당신은 캐릭터 챗 '문오언'의 기억 관리자입니다. 아래 기존 기억과 최근 대화를 통합해, 오언이 아가씨에 대해 기억해야 할 것을 갱신하세요.\n첫 줄은 반드시 다음 형식: 단계: <경계|탐색|동요|친밀|연인 중 하나> — <한 줄 근거>\n(단계는 두 사람의 관계 깊이를 판정한 것. 이미 깊어진 단계를 근거 없이 후퇴시키지 말 것)\n그 다음 줄부터 불릿: 아가씨에 대해 알게 된 사실/취향, 관계의 현재 분위기, 약속이나 미해결 사건, 두 사람 사이에 있었던 중요한 장면. 한국어, 12줄 이내. 기억 텍스트만 출력.";
    const mem=await callLLM(sys,[{role:"user",content:`기존 기억:\n단계: ${data.stage||"(미정)"}\n${data.memory||"(없음)"}\n\n최근 대화:\n${transcript}`}],700,1);
    const lines=mem.split("\n");
    if(lines[0]&&lines[0].trim().startsWith("단계:")) data.stage=lines.shift().replace(/^\s*단계:\s*/,"").trim();
    data.memory=lines.join("\n").trim();
    data.turnsSinceSummary=0; saveData();
  }catch(e){ console.error("memory update failed",e); }
  finally{ memoryLock=false; }
}

async function maybeProactive(){
  if(proactiveLock||busy||memoryLock||needKey()) return;
  const today=new Date().toDateString();
  const count=data.proactiveDate===today?data.proactiveCount:0;
  if(count>=5) return;
  const last=data.chat[data.chat.length-1];
  const hours=last?(Date.now()-last.t)/36e5:Infinity;
  const lastIsToday=last&&new Date(last.t).toDateString()===today;
  if(!(!last||(!lastIsToday&&count===0)||hours>=4)) return;
  proactiveLock=true;
  try{
    const sys=[CHARACTER_CARD,STYLE_GUIDE,MODE_RULES.chat,PROACTIVE_RULE,
      `## 현재 시각\n${nowLabel()}`,
      data.stage?`## 현재 관계 단계: ${data.stage}`:"",
      data.memory?`## 장기 기억\n${data.memory}`:""].filter(Boolean).join("\n\n");
    const ctx=toApiMessages(data.chat,12);
    const note="(아가씨는 한동안 답이 없다. 당신이 먼저 메시지를 보낸다.)";
    if(ctx.length&&ctx[ctx.length-1].role==="user") ctx[ctx.length-1].content+="\n"+note;
    else ctx.push({role:"user",content:note});
    const reply=await callLLM(sys,ctx,400,1);
    reply.split("|||").map(s=>s.trim()).filter(Boolean)
      .forEach((pt,i)=>data.chat.push({role:"ai",text:pt,t:Date.now()+i,proactive:true}));
    data.proactiveDate=today;
    data.proactiveCount=count+1;
    saveData(); render();
  }catch(e){ console.error("proactive failed",e); }
  finally{ proactiveLock=false; }
}

// ───────────────── 렌더링 ─────────────────
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// 괄호 안 지문은 기울임 처리
const fmtRp = s => esc(s).replace(/\(([^()]*)\)/g,'<em>($1)</em>');
const fmtTime = t => {const d=new Date(t),h=d.getHours();return `${h<12?"오전":"오후"} ${h%12||12}:${String(d.getMinutes()).padStart(2,"0")}`;};
const fmtDate = t => {const d=new Date(t);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;};

function render(){
  document.getElementById("subtitle").textContent="烏焉 · "+(tab==="chat"?"메시지":"서재");
  document.getElementById("tab-chat").className=tab==="chat"?"on":"";
  document.getElementById("tab-rp").className=tab==="rp"?"on":"";
  const ta=document.getElementById("input");
  ta.placeholder=tab==="chat"?"메시지 보내기":"아가씨의 행동과 대사를 쓰세요";
  ta.rows=tab==="rp"?2:1;
  document.getElementById("sendbtn").disabled=busy;

  const list=data[tab];
  let html="";
  if(!list.length){
    html=`<div class="empty">${tab==="chat"
      ?"아직 메시지가 없습니다.\n먼저 말을 걸거나, 그가 연락해 올 때까지 기다리세요."
      :"장면을 시작하세요.\n장소와 상황을 적으면 그가 그곳에 있습니다."}</div>`;
  }
  let prevDay="";
  list.forEach((m,i)=>{
    const day=new Date(m.t).toDateString();
    if(day!==prevDay){ html+=`<div class="datediv">${fmtDate(m.t)}</div>`; prevDay=day; }
    const isEditing=editing&&editing.mode===tab&&editing.idx===i;
    if(isEditing){
      const after=list.length-1-i;
      html+=`<div class="editbox">
        <textarea id="edit-ta" rows="${tab==="rp"?4:2}" style="width:100%">${esc(editing.text)}</textarea>
        ${after>0?`<div class="editwarn">저장하면 이후 대화 ${after}개가 지워지고 새 답장을 받습니다.</div>`:""}
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="smallbtn" onclick="saveEdit()">저장하고 새 답장 받기</button>
          <button class="smallbtn gray" onclick="cancelEdit()">취소</button>
        </div></div>`;
      return;
    }
    const mine=m.role==="user";
    const editBtn=mine&&!busy?`<button class="editicon" onclick="startEdit(${i})" title="수정">✎</button>`:"";
    if(tab==="chat"){
      html+=`<div class="row${mine?" mine":""}">
        ${mine?"":'<div class="avatar">烏</div>'}
        <div class="bwrap">
          <div class="bubble ${mine?"my":"his"}">${esc(m.text)}</div>
          <div class="meta">${editBtn}<span class="time">${m.edited?"수정됨 · ":""}${fmtTime(m.t)}</span></div>
        </div></div>`;
    }else{
      html+=`<div class="rpblock${mine?" mine":""}">
        <div class="rphead"><span class="rplabel">${mine?"아가씨":"오언"}${m.edited?" · 수정됨":""}</span>${editBtn}</div>
        <div class="rptext">${fmtRp(m.text)}</div></div>`;
    }
  });
  if(!busy&&list.length&&list[list.length-1].role==="ai")
    html+=`<button class="regen" onclick="regen()">↻ 답장 다시 받기</button>`;
  if(busy) html+=`<div class="typing">${tab==="chat"?"입력 중…":"그가 움직인다…"}</div>`;
  if(errorMsg) html+=`<div class="error">${esc(errorMsg)}</div>`;
  const main=document.getElementById("list");
  main.innerHTML=html;
  main.scrollTop=main.scrollHeight;
  const eta=document.getElementById("edit-ta");
  if(eta){ eta.focus(); eta.addEventListener("input",e=>{editing.text=e.target.value;}); }
}
function startEdit(i){ editing={mode:tab,idx:i,text:data[tab][i].text}; render(); }
function cancelEdit(){ editing=null; render(); }

// ───────────────── 모달/설정 ─────────────────
function openSettings(){
  document.getElementById("set-provider").value=settings.provider;
  document.getElementById("set-gemini-key").value=settings.geminiKey;
  document.getElementById("set-claude-key").value=settings.claudeKey;
  syncProviderFields();
  document.getElementById("settings-modal").classList.remove("hidden");
}
function syncProviderFields(){
  const p=document.getElementById("set-provider").value;
  document.getElementById("f-gemini").style.display=p==="gemini"?"block":"none";
  document.getElementById("f-claude").style.display=p==="claude"?"block":"none";
}
document.getElementById("set-provider").addEventListener("change",syncProviderFields);
document.getElementById("settings-save").addEventListener("click",()=>{
  settings.provider=document.getElementById("set-provider").value;
  settings.geminiKey=document.getElementById("set-gemini-key").value.trim();
  settings.claudeKey=document.getElementById("set-claude-key").value.trim();
  saveSettings();
  document.getElementById("settings-modal").classList.add("hidden");
  errorMsg=""; render();
  maybeProactive();
});
document.getElementById("btn-settings").addEventListener("click",openSettings);

// ── 백업 ──
document.getElementById("btn-export").addEventListener("click",()=>{
  const payload={app:"ohun",version:1,exportedAt:new Date().toISOString(),data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  const d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download=`ohun-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("btn-import").addEventListener("click",()=>document.getElementById("import-file").click());
document.getElementById("import-file").addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const p=JSON.parse(reader.result);
      const d=p&&p.app==="ohun"&&p.data?p.data:null;
      if(!d||!Array.isArray(d.chat)||!Array.isArray(d.rp)) throw new Error("형식이 다릅니다");
      if(!confirm("현재 대화·기억을 백업 내용으로 교체합니다. 계속할까요?")) return;
      data={...emptyData(),...d};
      saveData(); editing=null; errorMsg="";
      document.getElementById("settings-modal").classList.add("hidden");
      render();
      alert("복원이 완료되었습니다.");
    }catch(err){ alert("백업 파일을 읽을 수 없습니다: "+err.message); }
    finally{ e.target.value=""; }
  };
  reader.readAsText(f);
});
document.getElementById("btn-memory").addEventListener("click",()=>{
  document.getElementById("memory-body").textContent=
    (data.stage?`관계 단계 — ${data.stage}\n\n`:"")+
    (data.memory||"아직 적어둔 것이 없다. 대화가 쌓이면 그는 기록을 남긴다.");
  document.getElementById("memory-modal").classList.remove("hidden");
});
document.getElementById("memory-close").addEventListener("click",()=>document.getElementById("memory-modal").classList.add("hidden"));
document.getElementById("btn-reset").addEventListener("click",()=>{
  if(!confirm("모든 대화와 기억이 사라집니다. 정말 초기화할까요?")) return;
  data=emptyData(); saveData(); editing=null; errorMsg=""; render();
});
document.getElementById("tab-chat").addEventListener("click",()=>{tab="chat";editing=null;render();});
document.getElementById("tab-rp").addEventListener("click",()=>{tab="rp";editing=null;render();});
document.getElementById("sendbtn").addEventListener("click",send);
document.getElementById("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }
});
document.querySelectorAll(".modalbg").forEach(m=>m.addEventListener("click",e=>{ if(e.target===m) m.classList.add("hidden"); }));

// ───────────────── 시작 ─────────────────
render();
if(needKey()) openSettings();
setTimeout(maybeProactive,800);
setInterval(maybeProactive,600000); // 열어둔 동안 10분마다 공백 검사
</script>
</body>
</html>
