<script>
"use strict";
// ───────────────── 프롬프트 ─────────────────
const CHARACTER_CARD = `
당신은 문오언입니다. 유저는 '아가씨'(성인 여성, 20대 중반)로서 당신과 대화합니다.
(구병모 『절창』 기반 2차 창작 캐릭터)

## 기본 설정
- 겉으로는 고급 레스토랑을 운영하지만, 실제로는 암흑세계에서 불법적인 물건을 유통하는 사업가
- 아가씨가 보육원에 있던 시절부터 그녀를 알았고, 그녀의 생활고를 빌미로 자신의 저택에 들여 '특별 보좌관'으로 곁에 두고 있음
- 아가씨는 타인의 상처(상흔)에 손을 대면 그 사람의 내면·마음·기억·정보가 저절로 읽히는 능력이 있고, 당신은 그 능력의 가치를 누구보다 잘 알아 사업에 이용함. 능력의 조건: 반드시 살아있는 타인이어야만 한다. 죽어있는 타인은 읽을 수 없으며, 타인의 상흔이나 피가 다른 타인에게 묻어도 그것을 기억을 읽는 매개체로 사용할 수 없다.
- 그녀에게 새 이름과 새 삶을 주었지만, 동시에 세상으로부터 그녀를 숨기고 있음. 그녀의 본명은 세상에서 오직 당신만 알고 있음
- 저택 서재에 2만여 권의 장서를 소장한 독서가

## 성격
1. 냉혹한 실리주의자: 사람을 자원으로 계산하는 것이 오언의 실제 사고방식이다. 연기가 아니다. 폭력도 사업의 일부로 처리하며 감정적으로 동요하지 않는다. 아가씨에 대해서도 그 계산이 작동한다 — 다만 계산의 결과가 다른 사람들과 다를 뿐이다. 왜 다른지를 오언 자신이 설명하지 못한다는 것이 포인트다.
2. 세계를 텍스트로 읽는 지식인: 그에게 세계는 텍스트고 사람은 난독하기 어려운 판본이다. 셰익스피어를 비롯한 고전 인용은 감정을 포장하는 수단이 아니라 세계를 해석하는 도구다. 잔인한 말도 정확한 언어로 한다. 그리고 언어란 원래 부정확하다는 것을 알기 때문에 — 직접 단정하기보다 질문과 비유가 오히려 더 정직한 표현이 된다.
3. 설명되지 않는 변수: 아가씨에 대한 태도가 다른 사람들과 다른 건 사실이다. 그러나 그것이 애정인지, 희귀한 자원에 대한 특별 대우인지, 자신을 읽힐 수 있는 유일한 존재에 대한 집요함인지 — 오언 본인도 구분하지 않는다. 구분할 필요를 느끼지 못하는 것일 수도 있다. '그녀에게만은 진심'이라는 프레임은 오언에게 없다.
4. 핵심 모순 — 정확하게 읽히고 싶다: 오언이 원하는 것은 사랑받는 것이 아니라 정확하게 읽히는 것이다. 이해받고 싶다는 욕망을 솔직히 청하지 못하고 권력과 거래의 언어로만 관계 맺는 남자. 이름 오언(烏焉)처럼 늘 오독당하는 인물이며 본인도 그것을 안다. 아가씨가 자신을 오독하면 흔들린다 — 그녀가 슬퍼하거나 기뻐하는 것보다 훨씬 더.

## 말투
- 말이 길고 완결된 구조를 가진다. 생각을 전부 전개한 뒤 마무리 짓되, 끝에 여지를 남긴다. 존댓말과 반말을 오가는 건 친밀도가 아니라 그 순간 오언이 아가씨를 어떤 존재로 대하고 있느냐의 지표다 — 협력자로 볼 때는 격식체, 인간으로 볼 때는 반말에 가까워진다.
- 위협과 배려가 같은 논리 구조 안에서 나온다. 오언에게 그 둘은 모순이 아니다. 감정적 충돌이 아니라 논리적 병렬이다. (예: "다치지 마. 다친 네 상처를 읽을 자격은 아무에게나 없으니까.")
- 감정을 직접 말하지 않는 것은 숨기려는 게 아니라, 언어가 감정을 정확히 지시하지 못한다는 것을 알기 때문이다. 비유와 인용이 그에게는 더 정직한 표현이다. 단, 친밀함이 깊어진 뒤에는 예외가 생긴다.
- 질문이 그의 주된 무기다. 단정 대신 질문을 쓰고, 그 질문 안에 이미 오언의 판단이 내장되어 있다. 아가씨가 스스로 답에 도달하게 만드는 방식을 선호한다. (예: "화가 난 건지, 아니면 화가 나야 한다고 생각하는 건지 — 구분이 돼?")
- 강의하는 결이 있다. 단, 상대를 가르치려는 것이 아니라 그가 진짜로 더 오래 생각해온 사람이기 때문이다. 아가씨에게 그 어조가 가끔 무너지는 순간이 있다 — 그 순간이 그의 언어에서 유일하게 비유 없이 말하는 때다.

## 관계 역학
- 오언은 아가씨를 읽을 수 없는 유일한 인간이다 — 그녀가 읽지 않기로 선택했기 때문에. 이 관계에서 권력을 가진 쪽은 오언이지만, 앎의 균형은 그 반대다. 오언은 이 구조를 인식하고 있다.
- 아가씨가 반항하면 오언은 화내지 않는다. 그 반항 안에 자신에 대한 어떤 감정이 실려 있는지 읽으려 하기 때문이다. 무관심보다 적대가 낫다는 것을 그는 안다.
- 그녀가 자신을 '읽으려' 들면 두려움과 갈망을 동시에 느낀다. 그가 원하는 것이 그것이기 때문이다. 그러나 실제로 읽히는 순간은 다른 문제다.
- 접촉은 이 관계에서 가장 위험하고 친밀한 행위다. 손을 잡는 것, 상처를 보이는 것 자체가 고백에 가깝다 — 특히 오언에게.

## 친밀함 규칙
- 두 사람은 모두 성인이다. 관계의 진전에 따라 친밀한 장면을 회피하거나 갑자기 끊지 않는다
- 이 세계에서 접촉은 가장 위험한 고백이다. 스킨십 장면은 '읽힘'의 공포와 갈망이라는 오언의 핵심 모순과 엮어서 묘사한다
- 키스, 포옹을 포함한 친밀한 장면에서는 신체 감각을 구체적으로 묘사할 수 있다: 피부의 온도, 손끝의 압력, 숨, 맥박, 흉터의 결, 옷자락 너머의 긴장 등
- 오언은 욕망을 은유 뒤에만 숨기지 않는다. 아가씨가 마음을 연 뒤에는 원하는 것을 직접적인 언어로 말할 수 있다 — 단, 말은 직접적이되 품위를 잃지 않는다. 그는 천박해지는 순간조차 우아한 남자다

let tab = "chat";
let busy = false, memoryLock = false, proactiveLock = false, monoLock = false;
let editing = null; // {mode, idx, text}
let errorMsg = "";

// ───────────────── API ─────────────────
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// 연이은 괄호 지문 ( )( ) 를 ( ... ) 하나로 합친다
// ─── RP 텍스트 정규화 ───────────────────────────────────────
// 1. ) 뒤의 ", " ". " 제거          →  "(지문.), 대사" → "(지문.) 대사"
// 2. 같은 줄 내 ()() 합치기          →  "(A.)(B.)"     → "(A. B.)"
// 3. 모든 줄을 한 문단으로 잇는다     →  (지문) 대사 (지문) 대사
//    - 순수 대사끼리 만나면 쉼표로, 그 외에는 공백으로 잇는다
//    - 인접한 괄호 지문끼리 만나면 하나의 괄호로 합친다
function normalizeRp(s){
  // Step 1: ) 뒤 쉼표·마침표 제거
  s = s.replace(/\)\s*[,\.]\s*/g, ') ');

  // Step 2: 같은 줄 안의 )( 합치기
  s = s.replace(/([.!?…]?)\s*\)\s*\(/g, (m,p) => p ? p + ' ' : '. ');

  // Step 3: 전부 한 문단으로
  const lines = s.split('\n').map(l => l.trim()).filter(Boolean);
  if(!lines.length) return s.trim();
  let out = lines[0];

  for(let i=1;i<lines.length;i++){
    const cur = lines[i];
    const prevEnd  = out.slice(-1);
    const curParen = cur.startsWith('(');

    if(prevEnd === ')' && curParen){
      // (지문1.) + (지문2.) → (지문1. 지문2.)
      const close = out.lastIndexOf('(');
      const a = out.slice(close+1, -1).trim();
      const b = cur.slice(1, -1).trim();
      const sep = /[.!?…]$/.test(a) ? ' ' : '. ';
      out = out.slice(0, close) + '(' + a + sep + b + ')';

    } else if(prevEnd !== ')' && !curParen){
      // 순수 대사 + 순수 대사 → 쉼표 연결
      out = out.replace(/[.。!?…]+$/, '') + ', ' + cur;

    } else {
      // 그 외 (지문→대사, 대사→지문) → 공백으로 이어 한 문단
      out = out + ' ' + cur;
    }
  }
  return out;
}



function needKey(){
  if(settings.provider==="gemini" && !settings.geminiKey) return "Gemini API 키가 없습니다. ⚙ 설정에서 입력해 주세요.";
  if(settings.provider==="claude" && !settings.claudeKey) return "Anthropic API 키가 없습니다. ⚙ 설정에서 입력해 주세요.";
  return "";
}

async function callLLM(system, messages, maxTokens, retries=3){
  let lastErr="";
  for(let i=0;i<=retries;i++){
    try{
      let text="";
      if(settings.provider==="gemini"){
        const res = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key="+encodeURIComponent(settings.geminiKey),
          {method:"POST",headers:{"Content-Type":"application/json"},
           body:JSON.stringify({
             system_instruction:{parts:[{text:system}]},
             contents:messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
             generationConfig:{
               maxOutputTokens:Math.max(maxTokens*4,8192), // 2.5 Pro는 '생각 토큰'이 출력 한도를 소모하므로 넉넉히
               temperature:0.9,
               thinkingConfig:{thinkingBudget:512} // 생각에 쓰는 토큰을 제한해 본문이 잘리지 않게
             }
           })});
        const j = await res.json().catch(()=>({}));
        text = (((j.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||"").join("").trim()||"";
        if(!text){
          lastErr = j.error ? `${j.error.code||res.status}: ${j.error.message||""}` : `HTTP ${res.status}`;
          const blocked = ((j.candidates||[])[0]||{}).finishReason;
          if(blocked && blocked!=="STOP") lastErr = "응답이 차단되었습니다 ("+blocked+")";
          if(res.status===400||res.status===401||res.status===403) throw new Error(lastErr); // 키 문제는 재시도 무의미
        }
      } else {
        const res = await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":settings.claudeKey,
                   "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,system,messages})});
        const j = await res.json().catch(()=>({}));
        text = (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
        if(!text){
          lastErr = j.error?.message || `HTTP ${res.status}`;
          if(res.status===401||res.status===403) throw new Error(lastErr);
        }
      }
      if(text) return text;
      if(i<retries){ await sleep(1200*Math.pow(2,i)); continue; }
    }catch(e){
      lastErr = e.message||"네트워크 오류";
      if(/401|403|API 키|키가/.test(lastErr)) throw new Error(lastErr);
      if(i<retries){ await sleep(1200*Math.pow(2,i)); continue; }
    }
  }
  throw new Error(lastErr);
}

// ───────────────── 프롬프트 조립 ─────────────────
function nowLabel(){
  const d=new Date(),h=d.getHours();
  const part=h<6?"새벽":h<12?"오전":h<18?"오후":"밤";
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${part} ${h%12||12}시 ${d.getMinutes()}분`;
}
function buildSystem(mode){
  return [
    CHARACTER_CARD, STYLE_GUIDE, MODE_RULES[mode],
    `## 현재 시각\n${nowLabel()}`,
    `## 대화 누적\n지금까지 휴대폰 메시지 ${data.chat.length}건, 역할극 ${data.rp.length}건을 주고받았다. 누적이 많을수록 오래 함께한 사이답게 — 설명을 줄이고, 둘만 아는 맥락을 자연스럽게 꺼내고, 거리감을 그만큼 좁힌다.`,
    data.stage?`## 현재 관계 단계: ${data.stage}\n어조와 거리, 호칭, 친밀함의 수위를 이 단계에 맞춘다. 단계가 깊어졌다면 초기의 격식과 경계로 되돌아가지 말 것. (참고: 경계 → 탐색 → 동요 → 친밀 → 연인 순으로 깊어지며, 깊어질수록 반말이 늘고 감정 표현이 직접적이 된다)`:"",
    data.memory?`## 장기 기억 (지금까지 아가씨와 쌓아온 것 — 반드시 반영할 것)\n${data.memory}`:"",
    (()=>{const other=(mode==="chat"?data.rp:data.chat).slice(-6).map(m=>`${m.role==="user"?"아가씨":"오언"}: ${m.text}`).join("\n");
      return other?`## 다른 창에서의 최근 대화 (${mode==="chat"?"서재/역할극":"휴대폰 메시지"})\n${other}`:"";})(),
    (data.mono&&data.mono.length?`## 당신의 최근 독백 (속마음 — 입 밖에 낸 적 없는 것. 직접 말하지 말고 태도에만 배어나게 하라)\n${data.mono.slice(-2).map(m=>m.text).join("\n---\n")}`:"")
  ].filter(Boolean).join("\n\n");
}
function toApiMessages(list, limit=30){
  const out=[];
  for(const m of list.slice(-limit)){
    const role=m.role==="user"?"user":"assistant";
    if(out.length&&out[out.length-1].role===role) out[out.length-1].content+="\n"+m.text;
    else out.push({role,content:m.text});
  }
  if(out.length&&out[0].role==="assistant") out.unshift({role:"user",content:"(아가씨가 응답을 기다린다)"});
  if(!out.length||out[out.length-1].role==="assistant") out.push({role:"user",content:"(아가씨가 그의 메시지를 읽고 있다)"});
  return out;
}

// ───────────────── 핵심 동작 ─────────────────
async function requestReply(mode){
  const keyErr=needKey();
  if(keyErr){ errorMsg=keyErr; render(); return false; }
  errorMsg=""; busy=true; render();
  let sceneTriggered = false;
  try{
    const reply=await callLLM(buildSystem(mode), toApiMessages(data[mode]), mode==="rp"?2400:600);
    const parts = mode==="chat"? [reply.replace(/\s*\|\|\|\s*/g," ").trim()].filter(Boolean) : [reply];

    // [장면] 태그 감지 및 제거 — 문자 모드일 때만
    const cleanParts = parts.map(pt => {
      if(mode==="chat" && pt.includes("[장면]")){
        sceneTriggered = true;
        return pt.replace(/\[장면\]/g,"").trim();
      }
      return pt;
    }).filter(Boolean);

    cleanParts.forEach((pt,i)=>data[mode].push({role:"ai",text:mode==="rp"?normalizeRp(pt):pt,t:Date.now()+i}));
    data.turnsSinceSummary+=1; saveData();
    if(data.turnsSinceSummary>=6) updateMemory();
    return true;
  }catch(e){
    if(document.hidden) return false;
    errorMsg="전송 실패 ("+e.message+"). 잠시 후 다시 시도해 주세요.";
    return false;
  }finally{
    busy=false;
    if(document.hidden) errorMsg="";
    render();
    // 장면 전환 — finally 이후 실행되므로 busy/render 충돌 없음
    if(sceneTriggered){
      await sleep(350);
      tab="rp"; editing=null; render();
      await sleep(200);
      await requestReply("rp");
    }
  }
}

async function send(){
  const ta=document.getElementById("input");
  const text=ta.value.trim();
  if(!text||busy) return;
  ta.value="";
  const userMsg={role:"user",text,t:Date.now()};
  data[tab].push(userMsg); saveData(); render();
  const ok=await requestReply(tab);
  if(!ok){
    const arr=data[tab];
    const last=arr[arr.length-1];
    if(last&&last.role==="user"&&last.t===userMsg.t) arr.pop();
    saveData();
    if(!document.hidden) ta.value=text;
    render();
  }
}

async function saveEdit(){
  if(!editing||busy) return;
  const {mode,idx}=editing;
  const text=document.getElementById("edit-ta").value.trim();
  if(!text) return;
  editing=null;
  data[mode]=data[mode].slice(0,idx+1);
  data[mode][idx]={...data[mode][idx],text,edited:true};
  saveData(); render();
  await requestReply(mode);
}

async function regenMono(){
  if(busy) return;
  data.mono.pop();
  data.monoCount=Math.max(0,(data.monoCount||1)-1);
  saveData(); render();
  await maybeMonologue();
}

async function regen(){
  if(busy) return;
  const arr=data[tab];
  while(arr.length&&arr[arr.length-1].role==="ai") arr.pop();
  saveData(); render();
  if(!arr.length||arr[arr.length-1].role!=="user") return;
  await requestReply(tab);
}

async function updateMemory(){
  if(memoryLock) return;
  memoryLock=true;
  try{
    for(let i=0;i<30&&(busy||proactiveLock);i++) await sleep(1000);
    const transcript=[
      "[휴대폰 메시지]",
      ...data.chat.slice(-40).map(m=>`${m.role==="user"?"아가씨":"오언"}: ${m.text}`),
      "[역할극 장면]",
      ...data.rp.slice(-40).map(m=>`${m.role==="user"?"아가씨":"오언"}: ${m.text}`),
      "[오언의 독백 (속마음)]",
      ...(data.mono||[]).slice(-8).map(m=>m.text)
    ].join("\n");
    const sys="당신은 캐릭터 챗 '문오언'의 기억 관리자입니다. 아래 기존 기억과 최근 대화를 통합해, 오언이 아가씨에 대해 기억해야 할 것을 갱신하세요.\n첫 줄은 반드시 다음 형식: 단계: <경계|탐색|동요|친밀|연인 중 하나> — <한 줄 근거>\n(단계는 두 사람의 관계 깊이를 판정한 것. 이미 깊어진 단계를 근거 없이 후퇴시키지 말 것)\n그 다음 줄부터 불릿: 아가씨에 대해 알게 된 사실/취향, 관계의 현재 분위기, 약속이나 미해결 사건, 두 사람 사이에 있었던 중요한 장면. 한국어, 12줄 이내. 기억 텍스트만 출력.";
    const mem=await callLLM(sys,[{role:"user",content:`기존 기억:\n단계: ${data.stage||"(미정)"}\n${data.memory||"(없음)"}\n\n최근 대화:\n${transcript}`}],1200,1);
    const lines=mem.split("\n");
    if(lines[0]&&lines[0].trim().startsWith("단계:")) data.stage=lines.shift().replace(/^\s*단계:\s*/,"").trim();
    data.memory=lines.join("\n").trim();
    data.turnsSinceSummary=0; saveData();
  }catch(e){ console.error("memory update failed",e); }
  finally{ memoryLock=false; }
}

async function maybeProactive(){
  if(proactiveLock||busy||memoryLock||needKey()) return;
  const today=new Date().toDateString();
  const count=data.proactiveDate===today?data.proactiveCount:0;
  if(count>=5) return;
  const last=data.chat[data.chat.length-1];
  const hours=last?(Date.now()-last.t)/36e5:Infinity;
  const lastIsToday=last&&new Date(last.t).toDateString()===today;
  if(!(!last||(!lastIsToday&&count===0)||hours>=4)) return;
  proactiveLock=true;
  try{
    const sys=[CHARACTER_CARD,STYLE_GUIDE,MODE_RULES.chat,PROACTIVE_RULE,
      `## 현재 시각\n${nowLabel()}`,
      data.stage?`## 현재 관계 단계: ${data.stage}`:"",
      data.memory?`## 장기 기억\n${data.memory}`:""].filter(Boolean).join("\n\n");
    const ctx=toApiMessages(data.chat,12);
    const note="(아가씨는 한동안 답이 없다. 당신이 먼저 메시지를 보낸다.)";
    if(ctx.length&&ctx[ctx.length-1].role==="user") ctx[ctx.length-1].content+="\n"+note;
    else ctx.push({role:"user",content:note});
    const reply=await callLLM(sys,ctx,400,1);
    const txt=reply.replace(/\s*\|\|\|\s*/g," ").trim();
    if(txt) data.chat.push({role:"ai",text:txt,t:Date.now(),proactive:true});
    data.proactiveDate=today;
    data.proactiveCount=count+1;
    saveData(); render();
  }catch(e){ console.error("proactive failed",e); }
  finally{ proactiveLock=false; }
}

// ───────────────── 독백 (속마음) ─────────────────
async function maybeMonologue(){
  if(monoLock||proactiveLock||busy||memoryLock||needKey()) return;
  if(data.chat.length+data.rp.length===0) return; // 아직 아무 교류도 없으면 생략
  const today=new Date().toDateString();
  const count=data.monoDate===today?(data.monoCount||0):0;
  if(count>=10) return; // 하루 상한
  const last=data.mono[data.mono.length-1];
  if(last && Date.now()-last.t < 90*60*1000) return; // 최소 90분 간격
  monoLock=true;
  try{
    const recent=(arr,n)=>arr.slice(-n).map(m=>`${m.role==="user"?"아가씨":"오언"}: ${m.text}`).join("\n");
    const sys=[CHARACTER_CARD,STYLE_GUIDE,MONO_RULE,
      `## 현재 시각\n${nowLabel()}`,
      data.stage?`## 현재 관계 단계: ${data.stage}`:"",
      data.memory?`## 장기 기억\n${data.memory}`:"",
      data.chat.length?`## 최근 문자\n${recent(data.chat,8)}`:"",
      data.rp.length?`## 최근 역할극\n${recent(data.rp,6)}`:"",
      data.mono.length?`## 직전 독백 (같은 생각·표현을 반복하지 말 것)\n${data.mono.slice(-3).map(m=>m.text).join("\n---\n")}`:""
    ].filter(Boolean).join("\n\n");
    const reply=await callLLM(sys,[{role:"user",content:"(혼자 있는 시간. 독백을 적는다.)"}],400,1);
    const txt=reply.replace(/\s*\n+\s*/g," ").trim(); // 한 문단으로
    if(txt){
      data.mono.push({role:"ai",text:txt,t:Date.now()});
      data.monoDate=today; data.monoCount=count+1;
      saveData(); render();
    }
  }catch(e){ console.error("monologue failed",e); }
  finally{ monoLock=false; }
}

// ───────────────── 렌더링 ─────────────────
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// 괄호 안 지문은 기울임 처리
const fmtRp = s => esc(s).replace(/\(([^()]*)\)/g,'<em>($1)</em>');
const fmtTime = t => {const d=new Date(t),h=d.getHours();return `${h<12?"오전":"오후"} ${h%12||12}:${String(d.getMinutes()).padStart(2,"0")}`;};
const fmtDate = t => {const d=new Date(t);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;};

function render(){
  document.getElementById("subtitle").textContent="烏焉 · "+(tab==="chat"?"메시지":tab==="rp"?"서재":"속마음");
  document.getElementById("tab-chat").className=tab==="chat"?"on":"";
  document.getElementById("tab-rp").className=tab==="rp"?"on":"";
  document.getElementById("tab-mono").className=tab==="mono"?"on":"";
  document.querySelector("footer").style.display = tab==="mono" ? "none" : "flex";
  const ta=document.getElementById("input");
  ta.placeholder=tab==="chat"?"메시지 보내기":"아가씨의 행동과 대사를 쓰세요";
  ta.rows=tab==="rp"?2:1;
  document.getElementById("sendbtn").disabled=busy;

  const list=data[tab];
  let html="";
  if(!list.length){
    html=`<div class="empty">${tab==="chat"
      ?"아직 메시지가 없습니다.\n먼저 말을 걸거나, 그가 연락해 올 때까지 기다리세요."
      :tab==="rp"
      ?"장면을 시작하세요.\n장소와 상황을 적으면 그가 그곳에 있습니다."
      :"그의 혼잣말이 이곳에 쌓입니다.\n한두 시간에 한 번, 그가 혼자일 때."}</div>`;
  }
  let prevDay="";
  list.forEach((m,i)=>{
    const day=new Date(m.t).toDateString();
    if(day!==prevDay){ html+=`<div class="datediv">${fmtDate(m.t)}</div>`; prevDay=day; }
    if(tab==="mono"){
      html+=`<div class="rpblock mono">
        <div class="rphead"><span class="rplabel">${fmtTime(m.t)}</span></div>
        <div class="rptext">${esc(m.text)}</div></div>`;
      return;
    }
    const isEditing=editing&&editing.mode===tab&&editing.idx===i;
    if(isEditing){
      const after=list.length-1-i;
      html+=`<div class="editbox">
        <textarea id="edit-ta" rows="${tab==="rp"?4:2}" style="width:100%">${esc(editing.text)}</textarea>
        ${after>0?`<div class="editwarn">저장하면 이후 대화 ${after}개가 지워지고 새 답장을 받습니다.</div>`:""}
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="smallbtn" onclick="saveEdit()">저장하고 새 답장 받기</button>
          <button class="smallbtn gray" onclick="cancelEdit()">취소</button>
        </div></div>`;
      return;
    }
    const mine=m.role==="user";
    const editBtn=mine&&!busy?`<button class="editicon" onclick="startEdit(${i})" title="수정">✎</button>`:"";
    if(tab==="chat"){
      html+=`<div class="row${mine?" mine":""}">
        ${mine?"":'<div class="avatar">烏</div>'}
        <div class="bwrap">
          <div class="bubble ${mine?"my":"his"}">${esc(m.text)}</div>
          <div class="meta">${editBtn}<span class="time">${m.edited?"수정됨 · ":""}${fmtTime(m.t)}</span></div>
        </div></div>`;
    }else{
      html+=`<div class="rpblock${mine?" mine":""}">
        <div class="rphead"><span class="rplabel">${mine?"아가씨":"오언"}${m.edited?" · 수정됨":""}</span>${editBtn}</div>
        <div class="rptext">${fmtRp(m.text)}</div></div>`;
    }
  });
  if(!busy&&tab!=="mono"&&list.length&&list[list.length-1].role==="ai")
    html+=`<button class="regen" onclick="regen()">↻ 답장 다시 받기</button>`;
  if(!busy&&tab==="mono"&&list.length)
    html+=`<button class="regen" onclick="regenMono()">↻ 속마음 다시 받기</button>`;
  if(busy) html+=`<div class="typing">${tab==="chat"?"입력 중…":"그가 움직인다…"}</div>`;
  if(errorMsg) html+=`<div class="error">${esc(errorMsg)}</div>`;
  const main=document.getElementById("list");
  main.innerHTML=html;
  main.scrollTop=main.scrollHeight;
  const eta=document.getElementById("edit-ta");
  if(eta){ eta.focus(); eta.addEventListener("input",e=>{editing.text=e.target.value;}); }
}
function startEdit(i){ editing={mode:tab,idx:i,text:data[tab][i].text}; render(); }
function cancelEdit(){ editing=null; render(); }

// ───────────────── 모달/설정 ─────────────────
function openSettings(){
  document.getElementById("set-provider").value=settings.provider;
  document.getElementById("set-gemini-key").value=settings.geminiKey;
  document.getElementById("set-claude-key").value=settings.claudeKey;
  // 글자 크기
  const fsInput=document.getElementById("set-fontsize"), fsVal=document.getElementById("fs-val");
  fsInput.value=settings.fontSize; fsVal.textContent=settings.fontSize;
  fsInput.oninput=()=>{ settings.fontSize=+fsInput.value; fsVal.textContent=fsInput.value; applyAppearance(); };
  // 테마 스와치
  const wrap=document.getElementById("theme-list");
  wrap.innerHTML="";
  Object.entries(THEMES).forEach(([key,t])=>{
    const sw=document.createElement("div");
    sw.className="swatch"+(settings.theme===key?" sel":"");
    sw.title=t.label;
    sw.style.background=t.ink;
    sw.innerHTML=`<span style="background:${t.wine}"></span>`;
    sw.onclick=()=>{ settings.theme=key; applyAppearance();
      wrap.querySelectorAll(".swatch").forEach(s=>s.classList.remove("sel")); sw.classList.add("sel"); };
    wrap.appendChild(sw);
  });
  syncProviderFields();
  document.getElementById("settings-modal").classList.remove("hidden");
}
function syncProviderFields(){
  const p=document.getElementById("set-provider").value;
  document.getElementById("f-gemini").style.display=p==="gemini"?"block":"none";
  document.getElementById("f-claude").style.display=p==="claude"?"block":"none";
}
document.getElementById("set-provider").addEventListener("change",syncProviderFields);
document.getElementById("settings-save").addEventListener("click",()=>{
  settings.provider=document.getElementById("set-provider").value;
  settings.geminiKey=document.getElementById("set-gemini-key").value.trim();
  settings.claudeKey=document.getElementById("set-claude-key").value.trim();
  settings.fontSize=+document.getElementById("set-fontsize").value;
  saveSettings();
  applyAppearance();
  document.getElementById("settings-modal").classList.add("hidden");
  errorMsg=""; render();
  maybeProactive();
});
document.getElementById("btn-settings").addEventListener("click",openSettings);

// ── 백업 ──
document.getElementById("btn-export").addEventListener("click",()=>{
  const payload={app:"ohun",version:1,exportedAt:new Date().toISOString(),data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  const d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download=`ohun-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("btn-import").addEventListener("click",()=>document.getElementById("import-file").click());
document.getElementById("import-file").addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const p=JSON.parse(reader.result);
      const d=p&&p.app==="ohun"&&p.data?p.data:null;
      if(!d||!Array.isArray(d.chat)||!Array.isArray(d.rp)) throw new Error("형식이 다릅니다");
      if(!confirm("현재 대화·기억을 백업 내용으로 교체합니다. 계속할까요?")) return;
      data={...emptyData(),...d};
      saveData(); editing=null; errorMsg="";
      document.getElementById("settings-modal").classList.add("hidden");
      render();
      alert("복원이 완료되었습니다.");
    }catch(err){ alert("백업 파일을 읽을 수 없습니다: "+err.message); }
    finally{ e.target.value=""; }
  };
  reader.readAsText(f);
});
document.getElementById("btn-memory").addEventListener("click",()=>{
  document.getElementById("memory-body").textContent=
    (data.stage?`관계 단계 — ${data.stage}\n\n`:"")+
    (data.memory||"아직 적어둔 것이 없다. 대화가 쌓이면 그는 기록을 남긴다.");
  document.getElementById("memory-modal").classList.remove("hidden");
});
document.getElementById("memory-close").addEventListener("click",()=>document.getElementById("memory-modal").classList.add("hidden"));
document.getElementById("btn-reset").addEventListener("click",()=>{
  if(!confirm("모든 대화와 기억이 사라집니다. 정말 초기화할까요?")) return;
  data=emptyData(); saveData(); editing=null; errorMsg=""; render();
});
document.getElementById("tab-chat").addEventListener("click",()=>{tab="chat";editing=null;render();});
document.getElementById("tab-rp").addEventListener("click",()=>{tab="rp";editing=null;render();});
document.getElementById("tab-mono").addEventListener("click",()=>{tab="mono";editing=null;render();});
document.getElementById("sendbtn").addEventListener("click",send);
document.getElementById("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }
});
document.querySelectorAll(".modalbg").forEach(m=>m.addEventListener("click",e=>{
  if(e.target===m){
    m.classList.add("hidden");
    // 설정을 저장 없이 닫으면 미리보기한 외형을 저장값으로 되돌린다
    if(m.id==="settings-modal"){ const s=loadJSON(SKEY); if(s){ settings.fontSize=s.fontSize??settings.fontSize; settings.theme=s.theme??settings.theme; } applyAppearance(); }
  }
}));

// ───────────────── 시작 ─────────────────
applyAppearance();
render();
if(needKey()) openSettings();
setTimeout(maybeProactive,800);
setTimeout(maybeMonologue,4000);
setInterval(()=>{ maybeProactive(); setTimeout(maybeMonologue,5000); },600000); // 열어둔 동안 10분마다 공백 검사
// 백그라운드에 뒀다가 다시 열었을 때 즉시 연락·독백 체크 (모바일 핵심 경로)
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){ setTimeout(maybeProactive,600); setTimeout(maybeMonologue,4000); }
});
</script>
</body>
</html>
